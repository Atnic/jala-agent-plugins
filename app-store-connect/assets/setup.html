<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Store Connect API setup</title>
  <style>
    :root {
      color-scheme: light;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #fff; }
    main { flex: 1; width: min(100% - 40px, 460px); margin: 0 auto; padding: clamp(112px, 21.8vh, 157px) 0 40px; }
    .brand { margin-bottom: 20px; text-align: center; }
    .brand-icon { display: block; width: 44px; height: 44px; margin: 0 auto 12px; object-fit: contain; }
    h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: 0; font-weight: 400; }
    .intro { margin: 7px auto 0; max-width: 440px; color: #6e6e73; font-size: 13px; line-height: 18px; }
    form { width: 100%; }
    .field { margin: 0 0 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    input, select { display: block; width: 100%; height: 56px; border: 1px solid #d2d2d7; border-radius: 12px; padding: 0 16px; background: #fff; color: #1d1d1f; font: inherit; font-size: 14px; }
    input::placeholder { color: #6e6e73; opacity: 1; }
    input:focus, select:focus { outline: none; border-color: #007aff; box-shadow: 0 0 0 2px rgb(0 122 255 / 28%); }
    .hint { margin: 5px 4px 0; color: #6e6e73; font-size: 12px; line-height: 1.35; }
    .file-control { position: relative; }
    .file-control input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .file-picker { display: flex; width: 100%; height: 56px; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid #d2d2d7; border-radius: 12px; padding: 0 8px 0 16px; color: #6e6e73; font-size: 14px; cursor: pointer; }
    .file-picker span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-picker.has-file { color: #1d1d1f; }
    .file-control:focus-within .file-picker { border-color: #007aff; box-shadow: 0 0 0 2px rgb(0 122 255 / 28%); }
    .choose-file { flex: none; border-radius: 8px; padding: 7px 11px; background: #f5f5f7; color: #06c; font-size: 13px; font-weight: 500; }
    .security-note { margin: 18px 0 16px; color: #6e6e73; font-size: 12px; line-height: 1.4; text-align: center; }
    button { display: block; width: 100%; min-height: 52px; border: 0; border-radius: 12px; padding: 12px 18px; color: #fff; background: #007aff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color .15s ease; }
    button:hover:not(:disabled) { background: #0071e3; }
    button:focus-visible { outline: 3px solid rgb(0 122 255 / 35%); outline-offset: 3px; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 18px; margin-top: 12px; color: #424245; font-size: 12px; white-space: pre-wrap; text-align: center; }
    footer { padding: 14px 20px; background: #f5f5f7; color: #6e6e73; text-align: center; font-size: 11px; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { main { width: min(100% - 36px, 460px); padding-top: 96px; } }
    @media (max-height: 760px) { main { padding-top: 132px; } }
  </style>
</head>

      <h1>App Store Connect</h1>
      <p class="intro">Connect with an App Store Connect API key.</p>
    </header>
    <form id="setup">
      <div class="field">
        <label class="visually-hidden" for="keyType">API key type</label>
        <select id="keyType" required aria-describedby="keyTypeHint">
          <option value="team">Team API key</option>
          <option value="individual">Individual API key</option>
        </select>
        <p class="hint" id="keyTypeHint"></p>
      </div>
      <div class="field">
        <label class="visually-hidden" for="keyId">Key ID</label>
        <input id="keyId" autocomplete="off" autocapitalize="characters" required maxlength="10" placeholder="Key ID">
      </div>
      <div class="field" id="issuerField">
        <label class="visually-hidden" for="issuerId">Team Issuer ID</label>
        <input id="issuerId" autocomplete="off" placeholder="Team Issuer ID">
      </div>
      <div class="field">
        <label class="visually-hidden" for="privateKey">Private key file (.p8)</label>
        <div class="file-control">
          <input id="privateKey" type="file" accept=".p8,text/plain" required aria-describedby="privateKeyHint">
          <label class="file-picker" for="privateKey">
            <span id="fileName">Private key file (.p8)</span>
            <span class="choose-file">Choose File</span>
          </label>
        </div>
        <p class="hint" id="privateKeyHint">Select the private key downloaded from App Store Connect.</p>
      </div>
      <p class="security-note">Your private key stays on this computer. The local helper verifies it with Apple, then saves it in the OS secret store.</p>
      <button id="submit" type="submit">Verify and save locally</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <footer>App Store Connect API key setup · Local browser form</footer>
  <script nonce="__NONCE__">
    const form = document.querySelector('#setup');
    const type = document.querySelector('#keyType');
    const typeHint = document.querySelector('#keyTypeHint');
    const issuer = document.querySelector('#issuerId');
    const issuerField = document.querySelector('#issuerField');
    const file = document.querySelector('#privateKey');
    const fileName = document.querySelector('#fileName');
    const filePicker = document.querySelector('.file-picker');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const session = new URLSearchParams(location.hash.slice(1)).get('session') || '';
    history.replaceState(null, '', location.pathname);
    function syncType() {
      const team = type.value === 'team';
      issuerField.hidden = !team;
      issuer.required = team;
      issuer.disabled = !team;
      issuer.value = team ? issuer.value : '';
      typeHint.textContent = team
        ? 'Team keys can span all apps in the team, within the key’s assigned role.'
        : 'Individual keys follow the user’s app access and cannot access Sales or Finance reports.';
    }
    type.addEventListener('change', syncType);
    syncType();
    function clearSelectedFile() {
      file.value = '';
      fileName.textContent = 'Private key file (.p8)';
      filePicker.classList.remove('has-file');
    }
    file.addEventListener('change', () => {
      fileName.textContent = file.files?.[0]?.name || 'Private key file (.p8)';
      filePicker.classList.toggle('has-file', Boolean(file.files?.[0]));
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!session || !file.files?.[0]) return;
      button.disabled = true;
      status.textContent = 'Verifying with Apple and saving in the OS secret store…';
      try {
        const privateKey = await file.files[0].text();
        const response = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Setup-Token': session },
          body: JSON.stringify({
            keyType: type.value,
            keyId: document.querySelector('#keyId').value,
            issuerId: type.value === 'team' ? issuer.value : '',
            privateKey
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Setup failed.');
        status.textContent = `Connected using a ${result.keyType} key (${result.keyId}). Stored in the OS secret store.`;
        clearSelectedFile();
        document.querySelector('#keyId').value = '';
        issuer.value = '';
        setTimeout(() => window.close(), 900);
      } catch (error) {
        clearSelectedFile();
        status.textContent = error.message || 'Setup failed. Choose the .p8 file again and retry.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
