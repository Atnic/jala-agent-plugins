<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm App Store Connect change</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 820px; margin: 44px auto; padding: 0 22px; color: CanvasText; background: Canvas; }
    h1 { font-size: 26px; margin-bottom: 8px; } .warning { border-left: 4px solid #d58b00; padding: 12px 14px; background: color-mix(in srgb, #d58b00 12%, Canvas); }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; border-radius: 10px; background: color-mix(in srgb, CanvasText 6%, Canvas); }
    button { border: 0; border-radius: 8px; padding: 11px 18px; font-weight: 650; cursor: pointer; margin-right: 8px; }
    #approve { background: #c73d30; color: white; } #cancel { background: color-mix(in srgb, CanvasText 14%, Canvas); color: CanvasText; }
    #status { min-height: 24px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Confirm App Store Connect change</h1>
  <p class="warning"><strong>High-impact action:</strong> this request can delete or revoke a resource, change submission or release state, change pricing or availability, or change user access. Review the exact action below. Apple applies this change to production data.</p>
  <h2>__ACTION__</h2>
  <pre>__DETAILS__</pre>
  <button id="approve" type="button">Approve and send request</button>
  <button id="cancel" type="button">Cancel</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script nonce="__NONCE__">
    const token = new URLSearchParams(location.hash.slice(1)).get('session') || '';
    history.replaceState(null, '', location.pathname);
    const status = document.querySelector('#status');
    async function decide(choice) {
      document.querySelector('#approve').disabled = true;
      document.querySelector('#cancel').disabled = true;
      try {
        const response = await fetch('/api/decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Approval-Token': token },
          body: JSON.stringify({ choice })
        });
        if (!response.ok) throw new Error('This confirmation session expired. No request was sent.');
        status.textContent = choice === 'approve' ? 'Approved. The request is being sent to Apple.' : 'Cancelled. No request was sent.';
        setTimeout(() => window.close(), 900);
      } catch (error) {
        status.textContent = error.message || 'Confirmation failed. No request was sent.';
      }
    }
    document.querySelector('#approve').addEventListener('click', () => decide('approve'));
    document.querySelector('#cancel').addEventListener('click', () => decide('cancel'));
  </script>
</body>
</html>
