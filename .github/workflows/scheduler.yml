name: Scheduler checks

on:
  push:
    paths:
      - 'scheduler/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.agents/skills/create-plugin/**'
      - '.github/workflows/scheduler.yml'
  pull_request:
    paths:
      - 'scheduler/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.agents/skills/create-plugin/**'
      - '.github/workflows/scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scheduler/requirements-dev.txt
      - run: python scheduler/scripts/check.py
