<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Office for Codex</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      color-scheme: light;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252525;
      background: #fff;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 420px); margin: 0 auto; padding: 18px 16px 24px; }
    header { display: flex; align-items: center; gap: 11px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    header img { width: 38px; height: 38px; object-fit: contain; }
    h1 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 650; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .status { display: flex; align-items: center; gap: 8px; min-height: 42px; margin: 14px 0 10px; font-weight: 600; }
    .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
    .connected .dot { background: #15803d; }
    .error .dot { background: #dc2626; }
    .connecting .dot { background: #d97706; }
    dl { margin: 0; padding: 2px 0 14px; border-bottom: 1px solid var(--line); }
    .detail { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
    dt { color: var(--muted); }
    dd { max-width: 68%; margin: 0; text-align: right; overflow-wrap: anywhere; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    h2 { margin: 16px 0 7px; font-size: 12px; font-weight: 650; }
    pre { min-height: 36px; max-height: 220px; overflow: auto; margin: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 7px; background: #f8f9fb; color: #374151; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note { margin: 14px 0 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 300px) { main { padding-right: 12px; padding-left: 12px; } }
  </style>
</head>
<body>
<main>
  <header>
    <img src="./assets/icon-64.png" alt="">
    <div>
      <h1>Microsoft Office for Codex</h1>
      <p class="subtitle">Connected document and activity</p>
    </div>
  </header>
  <div id="status" class="status connecting" role="status" aria-live="polite"><span class="dot"></span><span>Waiting for Office.js…</span></div>
  <dl>
    <div class="detail"><dt>Office app</dt><dd id="host">Detecting</dd></div>
    <div class="detail"><dt>Platform</dt><dd id="platform">Detecting</dd></div>
    <div class="detail"><dt>Document ID</dt><dd id="document">Starting</dd></div>
  </dl>
  <h2>LAST RESULT</h2>
  <pre id="result">Waiting for Codex.</pre>
  <p class="note">Scripts have this pane’s regular JavaScript access. Review requests before allowing edits.</p>
</main>
<script>
  const documentId = crypto.randomUUID();
  const $ = (id) => document.getElementById(id);
  const state = { ready: false, socket: null, retry: null };
  const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
  $("document").textContent = documentId;

  function status(kind, label) {
    const el = $("status");
    el.className = `status ${kind}`;
    el.lastElementChild.textContent = label;
  }

  function asJson(value) {
    if (value === undefined) return null;
    const encoded = JSON.stringify(value);
    if (encoded === undefined) throw new TypeError("The script result must be JSON-serializable.");
    if (encoded.length > 50000) throw new RangeError("Result exceeds the 50,000 character limit.");
    return JSON.parse(encoded);
  }

  async function execute(message) {
    $("result").textContent = `Running request ${message.requestId}…`;
    try {
      const fn = new AsyncFunction("Office", "Excel", "Word", "PowerPoint", "globalThis", `"use strict";\n${message.script}`);
      const result = asJson(await fn(Office, globalThis.Excel, globalThis.Word, globalThis.PowerPoint, globalThis));
      const response = { type: "result", requestId: message.requestId, ok: true, result };
      $("result").textContent = JSON.stringify(response, null, 2);
      state.socket?.send(JSON.stringify(response));
    } catch (error) {
      const response = { type: "result", requestId: message.requestId, ok: false, error: { name: error?.name ?? "Error", message: error?.message ?? String(error) } };
      $("result").textContent = JSON.stringify(response, null, 2);
      state.socket?.send(JSON.stringify(response));
    }
  }

  function connect(info) {
    if (!info.host) {
      status("error", "Open this pane inside Word, Excel, or PowerPoint.");
      return;
    }
    const query = new URLSearchParams({ documentId, officeHost: info.host, platform: info.platform ?? "unknown" });
    const socket = new WebSocket(`wss://${location.host}/bridge/ws?${query}`);
    state.socket = socket;
    socket.onopen = () => status("connecting", "Connecting to Codex bridge…");
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === "connected") status("connected", "Connected to Codex. Ready for requests.");
      if (message.type === "execute" && message.documentId === documentId) execute(message);
    };
    socket.onerror = () => status("error", "Codex bridge unavailable. Reconnecting…");
    socket.onclose = () => {
      status("error", "Codex bridge disconnected. Reconnecting…");
      if (state.ready) state.retry = setTimeout(() => connect(info), 1200);
    };
  }

  Office.onReady((info) => {
    state.ready = true;
    $("host").textContent = info.host ?? "Unavailable";
    $("platform").textContent = info.platform ?? "Unavailable";
    connect(info);
  });
</script>
</body>
</html>
