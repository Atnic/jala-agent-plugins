<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex for Microsoft Office</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="./chat.css">
</head>
<body>
<main>
  <header class="topbar">
    <button id="history-toggle" class="icon-button" aria-label="Show chats" aria-expanded="false" aria-controls="history-panel"><i data-lucide="panel-left"></i></button>
    <h1>Codex</h1>
    <div id="status" class="status" role="status"><span class="dot"></span><span class="sr-only">Connecting document…</span></div>
    <button id="new-chat" class="icon-button" title="New chat" aria-label="New conversation" disabled><i data-lucide="square-pen"></i></button>
  </header>
  <nav id="history-panel" class="history-panel" aria-label="Conversations" hidden>
    <h2>Recent chats</h2>
    <select id="threads" aria-label="Choose a conversation" hidden disabled><option value="">New conversation</option></select>
    <div id="thread-list"></div>
    <button id="more-threads" class="text-button" hidden>Show more</button>
  </nav>
  <div class="connection-state"><span id="chat-status" role="status" aria-live="polite">Connecting to Codex…</span><button id="reconnect" class="text-button" hidden>Reconnect</button></div>
  <div id="error" role="alert" hidden></div>
  <button id="older" class="text-button" hidden>Load earlier messages</button>
  <section id="messages" aria-label="Conversation" aria-live="polite">
    <div id="empty"><img class="welcome-mark" src="./assets/codex-mark.svg" alt="Codex"><h2>What should we do in <span>this document?</span></h2></div>
  </section>
  <section id="approvals" aria-label="Requests from Codex"></section>
  <div class="composer-dock">
    <details class="connection" id="connection-details"><summary>Connection details</summary><dl><dt>Office app</dt><dd id="host">Detecting</dd><dt>Platform</dt><dd id="platform">Detecting</dd><dt>Document ID</dt><dd id="document"></dd></dl><h2>Last Office action</h2><pre id="result">No actions yet.</pre></details>
    <div class="composer-context" id="composer-context">
      <button id="project-toggle" type="button" class="context-document project-toggle" aria-label="Choose project" aria-controls="project-panel" aria-expanded="false" disabled><i data-lucide="folder-closed"></i><span id="project-label">Choose project</span><i data-lucide="chevron-down"></i></button>
      <span class="context-computer"><i data-lucide="laptop"></i><span>This computer</span></span>
      <button id="details-toggle" class="icon-button" aria-label="Connection details" aria-controls="connection-details" aria-expanded="false"><i data-lucide="settings"></i></button>
    </div>
    <section id="project-panel" class="project-panel" aria-label="Choose project" hidden>
      <label class="project-search" for="project-search"><i data-lucide="search"></i><input id="project-search" type="search" placeholder="Search projects" autocomplete="off" aria-label="Search projects"></label>
      <p id="project-status" role="status"></p>
      <div id="project-list" aria-label="Codex projects"></div>

    </section>
    <section id="model-panel" class="model-panel" aria-label="Model and reasoning" hidden>
      <h2>Model and reasoning</h2>
      <p id="model-status" role="status">Loading models…</p>
      <label for="model-choice">Model</label>
      <select id="model-choice" disabled></select>
      <p id="model-description"></p>
      <label for="effort-choice">Reasoning effort</label>
      <select id="effort-choice" disabled></select>
      <p>Applies to your next message.</p>
      <button id="refresh-models" type="button" class="text-button">Refresh models</button>
    </section>
    <form id="composer">
      <div id="attachments" class="attachments" aria-label="Attached files" aria-live="polite" hidden></div>
      <input id="file-input" type="file" multiple hidden>
      <label class="sr-only" for="prompt">Message Codex</label>
      <textarea id="prompt" rows="2" maxlength="32000" placeholder="Do anything" disabled></textarea>
      <div class="composer-actions">
        <button id="upload" type="button" class="icon-button" aria-label="Upload files" title="Upload files" disabled><i data-lucide="paperclip"></i></button>
        <button id="model-toggle" type="button" class="icon-button model-toggle" aria-label="Choose model and reasoning effort" title="Choose model and reasoning effort" aria-controls="model-panel" aria-expanded="false" disabled><i data-lucide="brain"></i></button>
        <button id="stop" type="button" class="round-button" aria-label="Stop response" title="Stop response" hidden><i data-lucide="square" fill="currentColor"></i></button>
        <button id="send" type="submit" class="round-button" aria-label="Send message" title="Send message" disabled><i data-lucide="arrow-up"></i></button>
      </div>
    </form>
  </div>
</main>
<script>
  const documentId = crypto.randomUUID();
  const $ = (id) => document.getElementById(id);
  const state = { ready: false, socket: null, retry: null };
  const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
  $("document").textContent = documentId;
  document.body.dataset.documentId = documentId;

  function status(kind, label) {
    const el = $("status");
    el.className = `status ${kind}`;
    el.lastElementChild.textContent = label;
  }

  function asJson(value) {
    if (value === undefined) return null;
    const encoded = JSON.stringify(value);
    if (encoded === undefined) throw new TypeError("The script result must be JSON-serializable.");
    if (encoded.length > 50000) throw new RangeError("Result exceeds the 50,000 character limit.");
    return JSON.parse(encoded);
  }

  async function execute(message) {
    $("result").textContent = `Running request ${message.requestId}…`;
    try {
      const fn = new AsyncFunction("Office", "Excel", "Word", "PowerPoint", "globalThis", `"use strict";\n${message.script}`);
      const result = asJson(await fn(Office, globalThis.Excel, globalThis.Word, globalThis.PowerPoint, globalThis));
      const response = { type: "result", requestId: message.requestId, ok: true, result };
      $("result").textContent = JSON.stringify(response, null, 2);
      state.socket?.send(JSON.stringify(response));
    } catch (error) {
      const response = { type: "result", requestId: message.requestId, ok: false, error: { name: error?.name ?? "Error", message: error?.message ?? String(error) } };
      $("result").textContent = JSON.stringify(response, null, 2);
      state.socket?.send(JSON.stringify(response));
    }
  }

  function connect(info) {
    if (!info.host) {
      status("error", "Open this pane inside Word, Excel, or PowerPoint.");
      return;
    }
    const query = new URLSearchParams({ documentId, officeHost: info.host, platform: info.platform ?? "unknown" });
    const socket = new WebSocket(`wss://${location.host}/bridge/ws?${query}`);
    state.socket = socket;
    socket.onopen = () => status("connecting", "Connecting to Codex bridge…");
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === "connected") { status("connected", "Document connected"); window.dispatchEvent(new Event("office-bridge-ready")); }
      if (message.type === "execute" && message.documentId === documentId) execute(message);
    };
    socket.onerror = () => status("error", "Codex bridge unavailable. Reconnecting…");
    socket.onclose = () => {
      status("error", "Codex bridge disconnected. Reconnecting…");
      if (state.ready) state.retry = setTimeout(() => connect(info), 1200);
    };
  }

  Office.onReady((info) => {
    state.ready = true;
    $("host").textContent = info.host ?? "Unavailable";
    $("platform").textContent = info.platform ?? "Unavailable";
    connect(info);
  });
</script>
<script src="./node_modules/markdown-it/dist/browser/markdown-it.umd.min.js" defer></script>
<script src="./node_modules/lucide/dist/umd/lucide.min.js" defer></script>
<script src="./chat.js" defer></script>
</body>
</html>
