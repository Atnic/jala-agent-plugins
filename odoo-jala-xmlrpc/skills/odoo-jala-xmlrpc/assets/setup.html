<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Odoo JALA</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, "Liberation Sans", Arial, sans-serif; color: #212529; background: #fff; font-size: 16px; line-height: 1.5; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; margin: 0; min-height: 100vh; }
    .brand-bar { flex-shrink: 0; height: 56px; background: #fff; box-shadow: 0 2px 4px #00000013; }
    .brand-container, .footer-container { width: 100%; margin: 0 auto; }
    .brand-container { height: 100%; padding: 8px 15px; }
    .brand-container img { display: block; height: 40px; width: auto; }
    main { width: calc(100% - 32px); max-width: 300px; margin: 50px auto; }
    .preview-alert { margin: 0 0 16px; padding: 12px; border: 1px solid #ffecb5; border-radius: 4px; background: #fff3cd; color: #664d03; font-size: 14px; text-align: center; }
    .field { margin-bottom: 16px; }
    label { display: inline-block; margin-bottom: 8px; font-weight: 700; }
    input { display: block; width: 100%; height: 38px; padding: 6px 12px; border: 1px solid #ced4da; border-radius: 4px; background: #fff; color: #212529; font: inherit; outline: none; transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out; }
    input::placeholder { color: #6c757d; opacity: 1; }
    input:focus { border-color: #80c2f9; box-shadow: 0 0 0 4px #0084f340; }
    input:disabled { background: #e9ecef; }
    .actions { padding-top: 16px; }
    button { display: block; width: 100%; min-height: 38px; padding: 6px 12px; border: 1px solid #0084f3; border-radius: 4px; background: #0084f3; color: #fff; font: inherit; text-align: center; cursor: pointer; }
    button:hover { background: #0070cf; border-color: #006ac2; }
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px #0084f340; }
    button:disabled { opacity: .65; cursor: default; }
    #message { margin: 16px 0 0; padding: 12px; border: 1px solid #f5c2c7; border-radius: 4px; background: #f8d7da; color: #842029; font-size: 14px; }
    #message:empty { display: none; }
    #message.success { border-color: #badbcc; background: #d1e7dd; color: #0f5132; }
    .storage-note { margin: 16px 0 0; color: #6c757d; font-size: 12px; line-height: 1.5; text-align: center; }
    .site-footer { flex-shrink: 0; margin-top: auto; background: #383e45; color: #fff; }
    .footer-container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 16px 15px; }
    .powered-by { display: inline-flex; align-items: center; gap: 5px; }
    .powered-by img { width: auto; height: 20px; }
    @media (min-width: 576px) { .brand-container, .footer-container { max-width: 540px; } }
    @media (min-width: 768px) { .brand-container, .footer-container { max-width: 720px; } }
    @media (min-width: 992px) { .brand-container, .footer-container { max-width: 960px; } }
    @media (min-width: 1200px) { .brand-container, .footer-container { max-width: 1140px; } }
    @media (min-width: 1400px) { .brand-container, .footer-container { max-width: 1320px; } }
    @media (prefers-reduced-motion: reduce) { input { transition: none; } }
  </style>
</head>
<body>
  <header class="brand-bar">
    <div class="brand-container"><img src="jala-logo.jpg" alt="JALA" width="140" height="55"></div>
  </header>
  <main>
    <p id="preview-alert" class="preview-alert" role="status" hidden>Preview Only</p>
    <form id="form" method="post" aria-label="Connect to Odoo JALA">
      <div class="field">
        <label for="username">Email</label>
        <input id="username" name="username" type="text" inputmode="email" placeholder="Email" autocomplete="username" autocapitalize="off" spellcheck="false" required maxlength="4096" autofocus>
      </div>
      <div class="field">
        <label for="key">Password (or API Key)</label>
        <input id="key" name="api-key" type="password" placeholder="Password or API Key" autocomplete="off" autocapitalize="off" spellcheck="false" required maxlength="4096">
      </div>
      <div class="actions"><button id="submit" type="submit">Connect</button></div>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="storage-note">Saved privately on this device.</p>
  </main>
  <footer class="site-footer">
    <div class="footer-container">
      <span>Copyright © JALA</span>
      <span class="powered-by">Powered by <img src="odoo-logo-dark.svg" alt="Odoo" width="621" height="196"></span>
    </div>
  </footer>
  <script nonce="__NONCE__">
    const defaults = {username: ''};
    /*__CONNECTION__*/
    const form = document.getElementById('form');
    const username = document.getElementById('username');
    const key = document.getElementById('key');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');
    const previewAlert = document.getElementById('preview-alert');
    username.value = defaults.username;
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    if (location.protocol !== 'file:') history.replaceState(null, '', location.pathname);
    if (!token || location.hostname !== '127.0.0.1') {
      for (const control of form.elements) control.disabled = true;
      if (location.protocol === 'file:') {
        previewAlert.hidden = false;
      } else {
        message.textContent = 'Open a fresh setup link from the Odoo connection helper to connect this form.';
      }
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token || submit.disabled) return;
      submit.disabled = true;
      submit.textContent = 'Checking connection…';
      form.setAttribute('aria-busy', 'true');
      message.className = '';
      message.textContent = '';
      try {
        const response = await fetch('/api/setup', {
          method: 'POST', credentials: 'omit', redirect: 'error',
          headers: {'Content-Type': 'application/json', 'X-Setup-Token': token},
          body: JSON.stringify({username: username.value.trim(), secret: key.value})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to connect. Check your details and try again.');
        key.value = '';
        for (const control of form.elements) control.disabled = true;
        submit.textContent = 'Connected';
        message.className = 'success';
        message.textContent = result.storage === 'native'
          ? 'Connected. Your details are saved in your system credential store. You can close this tab.'
          : 'Connected. Your details are saved in a private, unencrypted file on this device. You can close this tab.';
      } catch (error) {
        message.textContent = error instanceof TypeError
          ? 'The local setup session is unavailable. Open a fresh setup link and check connection status before trying again.'
          : error.message;
        submit.disabled = false;
        submit.textContent = 'Connect';
      } finally {
        form.removeAttribute('aria-busy');
      }
    });
  </script>
</body>
</html>
